<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IGC 3D Flight Viewer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">IGC 3D Flight Viewer</div>
      <div class="controls">
        <label for="igcFileInput">IGC File</label>
        <input id="igcFileInput" type="file" accept=".igc" />
        <button id="uploadBtn">Upload</button>
        <label for="baseView">View</label>
        <select id="baseView">
          <option value="map">Map</option>
          <option value="satellite" selected>Satellite</option>
        </select>
        <label for="playbackSpeed">Speed</label>
        <select id="playbackSpeed">
          <option value="0.1">0.1x</option>
          <option value="0.25" selected>0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1">1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <label for="speedUnit" title="Speed display unit">Speed unit</label>
        <select id="speedUnit">
          <option value="kmh" selected>km/h</option>
          <option value="kn">kn</option>
        </select>
        <label for="followCam">Follow Cam</label>
        <select id="followCam">
          <option value="off" selected>Off</option>
          <option value="on">On</option>
        </select>
        <label for="marker3d" title="Show the 3D marker at flight altitude instead of the map marker at ground level">3D Marker</label>
        <input id="marker3d" type="checkbox" />
        <button id="playBtn" disabled>Play</button>
        <button id="profileToggleBtn" type="button" aria-pressed="false">Profile</button>
      </div>
    </header>
    <main>
      <aside class="panel" id="infoPanel">
        <h2>Flight Info</h2>
        <div id="info"></div>
      </aside>
      <section id="map"></section>
    </main>
    <section id="profilePanel" class="profile-panel" hidden>
      <div class="profile-stats" id="profileStats">
        <div><span class="k">Alt MSL:</span> <span class="v" id="profileAltMsl">–</span></div>
        <div><span class="k">Height AGL:</span> <span class="v" id="profileAgl">–</span></div>
        <div><span class="k">Climb:</span> <span class="v" id="profileClimb">–</span></div>
        <div><span class="k">Speed:</span> <span class="v" id="profileSpeed">–</span></div>
      </div>
      <canvas id="profileCanvas"></canvas>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/deck.gl@9.4.2/dist.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
